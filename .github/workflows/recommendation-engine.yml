name: Recommendation Engine Checks

on:
  pull_request:
    branches: [development]
    paths:
      - "recommendation-engine/**"
      - ".github/workflows/recommendation-engine.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with API, PostgreSQL driver and HTTP test client
        working-directory: recommendation-engine
        run: pip install -e ".[api,postgres]" httpx

      - name: Unit tests + offline pipeline smoke
        working-directory: recommendation-engine
        run: python scripts/run_checks.py
