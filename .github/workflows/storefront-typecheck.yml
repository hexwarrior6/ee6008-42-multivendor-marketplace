name: Storefront Type Check

on:
  pull_request:
    branches: [development]
    paths:
      - "fyp-storefront/**"
      - ".github/workflows/storefront-typecheck.yml"
  workflow_dispatch:

jobs:
  tsc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # pinned here because packageManager lives in fyp-storefront/package.json,
          # not in a root package.json (same as backend-ci.yml)
          version: 11.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fyp-storefront/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: fyp-storefront
        run: pnpm install --frozen-lockfile

      # Strict gate: the recommendation-engine PR (PR #9) fixed all 18 known
      # type errors, so development type-checks clean. Any new error fails.
      - name: Type check (tsc --noEmit)
        working-directory: fyp-storefront
        run: npx tsc --noEmit
